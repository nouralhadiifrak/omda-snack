<!doctype html>
<!--
  AL-OMDA UI kit: the four pieces from al-omda.ma, standalone and framework-free.

  1. Flying emojis  Kit.emojiSpree(button, { emoji: "🌯" })  or  { src: "icon.png" }
                    A burst of 12 emojis sprays out of the button, spins, falls under
                    gravity and fades; the button squashes, then onLand() runs (bump the cart).
  2. Rolling numbers Kit.roll(node, 65)  /  Kit.setMoney(node, 65, "DH")
                    Odometer: changed digits slide out and the new ones roll in with a blur,
                    upwards when the number grows, downwards when it shrinks.
                    Kit.bump(node) is the little scale pop used on the cart button.
  3. Options pop-up  const line = await Kit.openOptions({ title, price, sizes, choices, sauces })
                    Native <dialog>: sizes and required choices as radio pills, sauces as
                    checkbox pills with colour swatches (max 2, the rest lock), a big
                    quantity stepper with a rolling number, and an "Ajouter · 25 DH" button.
                    Resolves to { size, option, sauces, qty }, or null when closed.
  4. All animations use the Web Animations API and are skipped for prefers-reduced-motion.

  To reuse: copy the <style> block into your CSS and the <script id="kit"> block into your JS.
  Colours are the CSS variables at the top of the style block. Open this file in a browser
  for a working demo.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AL-OMDA UI kit</title>
<style>
/* ===================== KIT CSS ===================== */
:root {
  --kit-accent: #d00000;      /* selected pills, stepper hover, add button */
  --kit-on-accent: #ffffff;
  --kit-panel: #ffffff;       /* dialog background */
  --kit-soft: #fff1cc;        /* stepper background */
  --kit-text: #000000;
  --kit-muted: rgba(0, 0, 0, 0.62);
  --kit-line: rgba(0, 0, 0, 0.14);
  --kit-radius: 18px;
  --kit-shadow: 0 16px 34px -20px rgba(0, 0, 0, 0.35);
}

/* 1. Flying emojis */
.spree {
  position: fixed;
  z-index: 90;
  font-size: 1.9rem;
  line-height: 1;
  pointer-events: none;
  will-change: transform, opacity;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
}
.spree--img { width: 2.6rem; height: auto; }

/* 2. Rolling numbers */
.roll {
  display: inline-flex;
  direction: ltr;
  font-variant-numeric: tabular-nums;
}
.roll__cell {
  position: relative;
  display: inline-block;
  overflow: hidden;
  padding-block: 0.08em; /* room for the blur without clipping the glyph */
  margin-block: -0.08em;
}
.roll__ch { display: inline-block; }
.roll__ch--out { position: absolute; inset-inline-start: 0; top: 0.08em; }
.money { display: inline-flex; align-items: baseline; white-space: nowrap; }
.bump { animation: kit-bump 0.4s ease; }
@keyframes kit-bump { 40% { transform: scale(1.18); } }

/* 3. Options pop-up */
.modal {
  width: min(460px, 100% - 24px);
  max-height: calc(100% - 24px);
  padding: 0;
  border: 1px solid var(--kit-line);
  border-radius: var(--kit-radius);
  background: var(--kit-panel);
  color: var(--kit-text);
  box-shadow: var(--kit-shadow);
  overflow-x: hidden;
}
.modal::backdrop { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); }
.modal[open] { animation: kit-pop 0.2s ease; }
@keyframes kit-pop { from { opacity: 0; transform: translateY(12px) scale(0.98); } }
.modal__form { display: grid; gap: 16px; padding: 20px; }
.modal__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal__head h3 { margin: 0; font-size: 1.35rem; line-height: 1.3; }
.modal__desc { margin: -8px 0 0; color: var(--kit-muted); }
.modal__fields { display: grid; gap: 16px; }
.modal__close {
  flex: none;
  width: 36px; height: 36px;
  border: 0; border-radius: 50%;
  background: var(--kit-soft); color: inherit;
  font-size: 1rem; cursor: pointer;
}
.field { display: grid; gap: 6px; margin: 0; padding: 0; border: 0; min-width: 0; }
.field__label { padding: 0; font-size: 0.85rem; font-weight: 700; color: var(--kit-muted); }

.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { position: relative; }
.pill input {
  position: absolute; inset: 0;
  width: 100%; height: 100%; margin: 0;
  opacity: 0; pointer-events: none;
}
.pill span {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--kit-line);
  font-weight: 700; font-size: 0.92rem;
  cursor: pointer;
}
.pill input:disabled + span { opacity: 0.4; cursor: not-allowed; }
.pill input:checked + span { background: var(--kit-accent); border-color: var(--kit-accent); color: var(--kit-on-accent); }
.pill input:focus-visible + span { outline: 3px solid var(--kit-accent); outline-offset: 2px; }
.pill__swatch {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--sauce);
  border: 1px solid rgba(0, 0, 0, 0.25);
}

.qty {
  display: inline-flex; align-items: center; gap: 10px;
  width: max-content; padding: 6px;
  border-radius: 999px; border: 1px solid var(--kit-line);
  background: var(--kit-soft);
}
.qty output { min-width: 56px; font-size: 1.6rem; font-weight: 800; justify-content: center; text-align: center; }
.qty__btn {
  display: grid; place-items: center;
  width: 44px; height: 44px;
  border: 0; border-radius: 50%;
  background: var(--kit-panel); color: inherit;
  cursor: pointer;
  transition: transform 0.12s ease, background-color 0.2s ease;
}
.qty__btn:disabled { opacity: 0.35; cursor: not-allowed; }
.qty__btn:not(:disabled):active { transform: scale(0.88); }
.qty__btn:hover:not(:disabled) { background: var(--kit-accent); color: var(--kit-on-accent); }

.modal__add {
  display: flex; justify-content: center; gap: 6px;
  width: 100%; padding: 14px 20px;
  border: 0; border-radius: 999px;
  background: var(--kit-accent); color: var(--kit-on-accent);
  font: inherit; font-weight: 800; font-size: 1.05rem;
  cursor: pointer;
}
/* =================== END KIT CSS =================== */

/* Demo page only */
body { margin: 0; padding: 24px 16px 60px; background: #ffba08; font-family: system-ui, sans-serif; }
.demo { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
.demo header { display: flex; align-items: center; justify-content: space-between; }
.demo h1 { margin: 0; font-size: 1.4rem; }
.cart { position: relative; padding: 10px 16px; border: 0; border-radius: 999px; background: #000; color: #ffba08; font-weight: 800; font-size: 1rem; }
.card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #fff; }
.card strong { display: block; }
.add { width: 44px; height: 44px; border: 0; border-radius: 50%; background: #d00000; color: #fff; font-size: 1.5rem; cursor: pointer; }
</style>
</head>
<body>
<main class="demo">
  <header>
    <h1>Kit demo</h1>
    <button class="cart" id="cart">🛒 <span class="roll" id="count"></span> · <span class="money" id="total"></span></button>
  </header>
  <div class="card"><div><strong>Shawarma Original</strong>20 DH · no options, adds straight away</div><button class="add" data-item="shawarma">+</button></div>
  <div class="card"><div><strong>Tacos</strong>sizes, a required choice and sauces</div><button class="add" data-item="tacos">+</button></div>
  <div class="card"><div><strong>Pizza Thon</strong>sizes only</div><button class="add" data-item="pizza">+</button></div>
</main>

<script id="kit">
/* ===================== KIT JS ===================== */
window.Kit = (() => {
  const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches || !Element.prototype.animate;
  const el = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else if (k === "dataset") Object.assign(node.dataset, v);
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
    });
    node.append(...children.flat().filter((c) => c != null && c !== false));
    return node;
  };

  // 1. Flying emojis: a burst of the dish's emoji (or an image) sprays out of the button,
  // spinning and falling under gravity. onLand runs as the burst peaks (bump the cart there).
  function emojiSpree(origin, { emoji, src, count = 12, onLand } = {}) {
    if (!origin || !origin.isConnected || reduce()) {
      onLand?.();
      return;
    }
    const box = origin.getBoundingClientRect();
    const cx = box.left + box.width / 2;
    const cy = box.top + box.height / 2;
    const gravity = 900; // px/s²

    origin.animate(
      [{ transform: "scale(1)" }, { transform: "scale(0.82)" }, { transform: "scale(1.18)" }, { transform: "scale(1)" }],
      { duration: 380, easing: "ease-out" }
    );

    for (let i = 0; i < count; i++) {
      const node = src
        ? el("img", { class: "spree spree--img", src, alt: "", "aria-hidden": "true" })
        : el("span", { class: "spree", "aria-hidden": "true" }, emoji);
      node.style.left = `${cx}px`;
      node.style.top = `${cy}px`;
      document.body.append(node);

      // Mostly upward, fanned out to both sides.
      const angle = (-90 + (Math.random() * 2 - 1) * 70) * (Math.PI / 180);
      const speed = 260 + Math.random() * 260; // px/s
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      const spin = (Math.random() * 2 - 1) * 540;
      const size = 0.7 + Math.random() * 0.7;
      const duration = 900 + Math.random() * 500;
      const secs = duration / 1000;

      const frames = [];
      for (let f = 0; f <= 10; f++) {
        const p = f / 10;
        const time = secs * p;
        const x = vx * time;
        const y = vy * time + 0.5 * gravity * time * time;
        const grow = p < 0.15 ? 0.3 + (p / 0.15) * 0.7 : 1;
        frames.push({
          transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${spin * p}deg) scale(${size * grow})`,
          opacity: p < 0.7 ? 1 : 1 - (p - 0.7) / 0.3,
          offset: p,
        });
      }
      node
        .animate(frames, { duration, easing: "linear", delay: i * 12, fill: "forwards" })
        .finished.then(() => node.remove());
    }
    if (onLand) setTimeout(onLand, 260);
  }

  // Scale pop, e.g. on the cart button when something lands in it.
  function bump(node) {
    node.classList.remove("bump");
    void node.offsetWidth; // restart the animation
    node.classList.add("bump");
  }

  // 2. Odometer-style number: changed digits slide out and the new ones roll in,
  // upwards when the number grows and downwards when it shrinks. `from` sets the
  // starting value for a node that was just created (so it can roll on first render).
  function roll(node, value, from) {
    const next = String(value);
    if (from != null && node.dataset.v == null) setDigits(node, String(from));
    const prev = node.dataset.v;
    if (prev === next) return;
    node.dataset.v = next;
    const dir = prev == null || reduce() ? 0 : Number(next) >= Number(prev) ? 1 : -1;
    const old = [...node.children].map((c) => c.dataset.ch);
    const cells = [...next].map((ch, i) => {
      const before = old[old.length - next.length + i];
      const cell = el("span", { class: "roll__cell", dataset: { ch } }, el("span", { class: "roll__ch" }, ch));
      if (dir && before !== ch) {
        const delay = (next.length - 1 - i) * 40;
        if (before != null) {
          const out = el("span", { class: "roll__ch roll__ch--out" }, before);
          cell.append(out);
          out
            .animate(
              [
                { transform: "translateY(0)", opacity: 1, filter: "blur(0)" },
                { transform: `translateY(${-dir * 100}%)`, opacity: 0, filter: "blur(3px)" },
              ],
              { duration: 320, delay, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" }
            )
            .finished.then(() => out.remove());
        }
        cell.firstChild.animate(
          [
            { transform: `translateY(${dir * 100}%)`, opacity: 0, filter: "blur(3px)" },
            { transform: "translateY(0)", opacity: 1, filter: "blur(0)" },
          ],
          { duration: 520, delay, easing: "cubic-bezier(.34,1.56,.64,1)", fill: "backwards" }
        );
      }
      return cell;
    });
    node.replaceChildren(...cells);
  }

  function setDigits(node, text) {
    node.dataset.v = text;
    node.replaceChildren(
      ...[...text].map((ch) => el("span", { class: "roll__cell", dataset: { ch } }, el("span", { class: "roll__ch" }, ch)))
    );
  }

  // "65 DH" with a rolling number and a static currency. `node` gets class "money".
  function setMoney(node, amount, currency = "DH", from) {
    let num = node.querySelector(".roll");
    let cur = node.querySelector(".money__cur");
    if (!num) {
      num = el("span", { class: "roll" });
      cur = el("span", { class: "money__cur" });
      node.replaceChildren(num, " ", cur);
    }
    cur.textContent = currency;
    roll(num, amount, from);
  }

  // 3. Options pop-up.
  //   title, desc       text at the top
  //   price             base price (ignored when sizes are given)
  //   sizes             [{ value: "M", label: "Moyenne", price: 60 }, ...]  (radio, first one checked)
  //   choices           [{ value: 0, label: "Poulet" }, ...]  a required choice (radio)
  //   sauces            [{ value: "algerienne", label: "Algérienne", color: "#e9a07a" }, ...]  (checkboxes)
  //   maxSauces         default 2; once reached, the other boxes lock
  //   currency, labels  texts, French by default
  // Resolves to { size, option, sauces, qty }, or null if the visitor closes it.
  const LABELS = {
    size: "Taille",
    choice: "Votre choix",
    sauce: "Sauces · 2 au choix",
    qty: "Quantité",
    add: "Ajouter",
    close: "Fermer",
  };
  let dialog;

  function pillGroup(type, name, legend, options, checked) {
    return el(
      "fieldset",
      { class: "field" },
      el("legend", { class: "field__label" }, legend),
      el(
        "div",
        { class: "pills" },
        options.map((o) =>
          el(
            "label",
            { class: "pill" },
            el("input", { type, name, value: o.value, checked: checked != null && String(o.value) === String(checked) }),
            el("span", {}, o.color ? el("i", { class: "pill__swatch", style: `--sauce:${o.color}` }) : null, o.label)
          )
        )
      )
    );
  }

  function buildDialog() {
    const minus = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M5 12h14"/></svg>';
    const plus = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M5 12h14M12 5v14"/></svg>';
    dialog = el("dialog", { class: "modal", "aria-labelledby": "kit-modal-title" });
    dialog.innerHTML = `
      <form method="dialog" class="modal__form">
        <header class="modal__head">
          <h3 id="kit-modal-title"></h3>
          <button class="modal__close" value="cancel" formnovalidate>✕</button>
        </header>
        <p class="modal__desc"></p>
        <div class="modal__fields"></div>
        <div class="field">
          <span class="field__label modal__qty-label"></span>
          <div class="qty">
            <button type="button" class="qty__btn" data-step="-1" aria-label="−">${minus}</button>
            <output class="roll"></output>
            <button type="button" class="qty__btn" data-step="1" aria-label="+">${plus}</button>
          </div>
        </div>
        <button class="modal__add" value="add"><span class="modal__add-label"></span> · <span class="money"></span></button>
      </form>`;
    document.body.append(dialog);
    // Close when clicking the backdrop.
    dialog.addEventListener("click", (e) => {
      if (e.target === dialog) dialog.close("cancel");
    });
  }

  function openOptions(opts) {
    if (!dialog) buildDialog();
    const L = { ...LABELS, ...opts.labels };
    const max = opts.maxSauces ?? 2;
    const currency = opts.currency ?? "DH";
    const $ = (s) => dialog.querySelector(s);
    const form = $("form");
    let qty = 1;

    $("h3").textContent = opts.title || "";
    $(".modal__desc").textContent = opts.desc || "";
    $(".modal__desc").hidden = !opts.desc;
    $(".modal__close").setAttribute("aria-label", L.close);
    $(".modal__qty-label").textContent = L.qty;
    $(".modal__add-label").textContent = L.add;

    const fields = [];
    if (opts.sizes) fields.push(pillGroup("radio", "size", L.size, opts.sizes.map((s) => ({ ...s, label: `${s.label} · ${s.price} ${currency}` })), opts.sizes[0].value));
    if (opts.choices) fields.push(pillGroup("radio", "option", L.choice, opts.choices, opts.choices[0].value));
    if (opts.sauces) fields.push(pillGroup("checkbox", "sauce", L.sauce, opts.sauces));
    $(".modal__fields").replaceChildren(...fields);

    const read = () => ({
      size: opts.sizes ? form.elements.size.value : undefined,
      option: opts.choices ? form.elements.option.value : undefined,
      sauces: [...form.querySelectorAll('input[name="sauce"]:checked')].map((i) => i.value),
      qty,
    });
    const unit = (line) => (opts.sizes ? opts.sizes.find((s) => String(s.value) === line.size).price : opts.price);
    const update = () => {
      const line = read();
      const full = line.sauces.length >= max;
      form.querySelectorAll('input[name="sauce"]').forEach((box) => (box.disabled = full && !box.checked));
      roll($(".qty output"), qty);
      $('.qty__btn[data-step="-1"]').disabled = qty <= 1;
      setMoney($(".modal__add .money"), unit(line) * qty, currency);
    };
    const onStep = (e) => {
      const b = e.target.closest(".qty__btn");
      if (!b) return;
      qty = Math.max(1, Math.min(50, qty + +b.dataset.step));
      update();
    };

    form.addEventListener("change", update);
    form.addEventListener("click", onStep);
    update();
    dialog.returnValue = "";
    dialog.showModal();

    return new Promise((resolve) => {
      dialog.addEventListener(
        "close",
        () => {
          form.removeEventListener("change", update);
          form.removeEventListener("click", onStep);
          resolve(dialog.returnValue === "add" ? read() : null);
        },
        { once: true }
      );
    });
  }

  return { emojiSpree, bump, roll, setMoney, openOptions };
})();
/* =================== END KIT JS =================== */
</script>

<script>
/* Demo wiring only */
const SAUCES = [
  { value: "algerienne", label: "Algérienne", color: "#e9a07a" },
  { value: "barbecue", label: "Barbecue", color: "#4a1f1a" },
  { value: "blanche", label: "Blanche", color: "#e8efe6" },
  { value: "samourai", label: "Samouraï", color: "#b3202e" },
  { value: "biggy", label: "Biggy", color: "#c9b48a" },
  { value: "andalouse", label: "Andalouse", color: "#e2752f" },
];
const ITEMS = {
  shawarma: { emoji: "🌯", title: "Shawarma Original", price: 20 },
  tacos: {
    emoji: "🌮", title: "Tacos", desc: "Frites, fromage, sauce au choix",
    sizes: [{ value: "M", label: "M", price: 35 }, { value: "L", label: "L", price: 45 }],
    choices: [{ value: "poulet", label: "Poulet" }, { value: "viande", label: "Viande hachée" }],
    sauces: SAUCES,
  },
  pizza: {
    emoji: "🍕", title: "Pizza Thon",
    sizes: [{ value: "M", label: "Moyenne", price: 50 }, { value: "L", label: "Large", price: 70 }],
  },
};
let count = 0, total = 0;
const cart = document.getElementById("cart");
Kit.roll(document.getElementById("count"), count);
Kit.setMoney(document.getElementById("total"), total);

document.querySelectorAll(".add").forEach((btn) =>
  btn.addEventListener("click", async () => {
    const item = ITEMS[btn.dataset.item];
    let line = { qty: 1 };
    if (item.sizes || item.choices || item.sauces) {
      line = await Kit.openOptions(item);
      if (!line) return;
    }
    const unit = item.sizes ? item.sizes.find((s) => s.value === line.size).price : item.price;
    Kit.emojiSpree(btn, {
      emoji: item.emoji,
      onLand: () => {
        Kit.bump(cart);
        count += line.qty;
        total += unit * line.qty;
        Kit.roll(document.getElementById("count"), count);
        Kit.setMoney(document.getElementById("total"), total);
      },
    });
  })
);
</script>
</body>
</html>
