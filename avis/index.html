<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votre avis · AL-OMDA</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffba08">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <style>
    :root { --yellow: #ffba08; --red: #d00000; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--yellow);
      color: #000;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    img { width: 160px; height: auto; }
    h1 { margin: 16px 0 6px; font-size: 1.6rem; }
    p { margin: 0 0 6px; line-height: 1.5; }
    .ar { direction: rtl; font-size: 1.1rem; }
    .stars { margin: 14px 0; font-size: 2rem; letter-spacing: 4px; color: var(--red); }
    a.btn {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="../assets/logo.png" alt="AL-OMDA · العمدة">
    <div class="stars" aria-hidden="true">★★★★★</div>
    <div id="go" hidden>
      <h1>Merci !</h1>
      <p>Ouverture de Google…</p>
      <p class="ar">شكراً! جاري فتح Google…</p>
      <a class="btn" id="go-link">Laisser un avis · قيّمنا</a>
    </div>
    <div id="soon" hidden>
      <h1>Merci pour votre visite !</h1>
      <p>Notre page d'avis Google arrive très bientôt.</p>
      <p class="ar">شكراً على الزيارة! صفحة التقييمات ديالنا فـ Google جاية قريب.</p>
      <a class="btn" href="../">Voir le menu · شوف المنيو</a>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script>
    var url = (window.CONFIG && CONFIG.googleReviewUrl) || "";
    if (url) {
      document.getElementById("go").hidden = false;
      document.getElementById("go-link").href = url;
      location.replace(url);
    } else {
      document.getElementById("soon").hidden = false;
    }
  </script>
</body>
</html>
