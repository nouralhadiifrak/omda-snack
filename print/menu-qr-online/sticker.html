<!doctype html>
<html><head><meta charset="utf-8">
<!-- Online menu QR sticker: 100 x 100 mm trim + 3 mm bleed. The QR opens
     https://al-omda.ma/menu, which forwards to the menu on the website. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@700;900&display=block" rel="stylesheet">
<style>
  @page { size: 106mm 106mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 106mm; height: 106mm; }
  .card { position: relative; width: 106mm; height: 106mm; overflow: hidden; background: #ffba08; font-family: "Cairo", sans-serif; color: #000; }
  .pattern { position: absolute; inset: 0; opacity: .07; background-image: radial-gradient(#000 1.1px, transparent 1.2px); background-size: 4mm 4mm; }
  .safe { position: absolute; inset: 7mm; justify-content: center; display: flex; flex-direction: column; align-items: center; gap: 3mm; }
  .top { display: flex; align-items: center; justify-content: center; gap: 3mm; height: 16mm; }
  .logo { height: 16mm; width: auto; }
  .title { font-family: "Anton", sans-serif; font-size: 7.2mm; line-height: 1.02; text-transform: uppercase; letter-spacing: .1mm; }
  .title em { font-style: normal; color: #d00000; }
  .qr-wrap { position: relative; width: 62mm; height: 62mm; background: #fff; border: .7mm solid #000; border-radius: 3.5mm; padding: 2.4mm; }
  .qr-wrap svg { width: 100%; height: 100%; display: block; }
  .qr-logo { position: absolute; left: 50%; top: 50%; width: 15mm; height: 15mm; transform: translate(-50%,-50%); background: #fff; border-radius: 2.5mm; padding: 1mm; display: grid; place-items: center; }
  .qr-logo img { width: 100%; height: auto; }
  .url { font-family: "Anton", sans-serif; font-size: 6.4mm; letter-spacing: .2mm; line-height: 1; }
  .url em { font-style: normal; color: #d00000; }
</style></head>
